name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Core tests
        run: bash run_tests.sh

  switch:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install portlibs
        run: dkp-pacman -Sy --needed --noconfirm switch-glfw switch-mesa switch-glm
      - name: Build
        run: |
          cmake -B build_switch -DPLATFORM_SWITCH=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build_switch --target SysToggle.nro -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: SysToggle
          path: build_switch/SysToggle.nro
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_switch/SysToggle.nro
          generate_release_notes: true
